<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Pranera Roll App: fabric roll + flat-knit collar + ribbed cuff -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26497a"/>
      <stop offset="1" stop-color="#16304f"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- ── Fabric roll (lying on its side, spiral end facing left) ── -->
  <g>
    <!-- body -->
    <path d="M24 19 H76 A7 13 0 0 1 76 45 H24 Z" fill="#ffffff"/>
    <!-- fabric texture lines on the body -->
    <g stroke="#c7d6ea" stroke-width="1.1" stroke-linecap="round">
      <line x1="33" y1="25" x2="77" y2="25"/>
      <line x1="33" y1="32" x2="79" y2="32"/>
      <line x1="33" y1="39" x2="77" y2="39"/>
    </g>
    <!-- unrolling fabric flap -->
    <path d="M70 45 L83 45 Q86 49 83 53 L66 53 Q69 49 70 45 Z" fill="#e3ecf7"/>
    <!-- spiral end -->
    <ellipse cx="24" cy="32" rx="7.5" ry="13" fill="#e3ecf7" stroke="#ffffff" stroke-width="1.5"/>
    <ellipse cx="24" cy="32" rx="5.2" ry="9" fill="none" stroke="#1e3a5f" stroke-width="1.3" opacity="0.55"/>
    <ellipse cx="24" cy="32" rx="3" ry="5.2" fill="none" stroke="#1e3a5f" stroke-width="1.3" opacity="0.55"/>
    <ellipse cx="24" cy="32" rx="1.3" ry="2.2" fill="#1e3a5f"/>
    <!-- accent selvedge stripe -->
    <path d="M31.5 19 V45" stroke="#f5a524" stroke-width="2.4"/>
  </g>

  <!-- ── Flat-knit collar (bottom-left): band around the neck opening,
       meeting in a V at the front with two pointed wings ── -->
  <g stroke-linejoin="round">
    <path d="M14 63 Q30 54 46 63 L47.5 84 L33 78.5 L30 81 L27 78.5 L12.5 84 Z" fill="#ffffff"/>
    <!-- neck opening -->
    <path d="M20 64.5 Q30 59.5 40 64.5 Q36.5 72.5 30 77.5 Q23.5 72.5 20 64.5 Z" fill="#1e3a5f"/>
    <!-- tipping stripes along the wing edges -->
    <path d="M15.5 81 L27 76.3" stroke="#f5a524" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M44.5 81 L33 76.3" stroke="#f5a524" stroke-width="2.2" stroke-linecap="round"/>
    <!-- fold line where collar meets band -->
    <path d="M15.2 66.5 Q30 59 44.8 66.5" fill="none" stroke="#c7d6ea" stroke-width="1.1"/>
  </g>

  <!-- ── Ribbed cuff (bottom-right) ── -->
  <g>
    <rect x="55" y="60" width="31" height="24" rx="3.5" fill="#ffffff"/>
    <!-- tipping stripes -->
    <rect x="55" y="64" width="31" height="2.6" fill="#f5a524"/>
    <rect x="55" y="68.4" width="31" height="1.4" fill="#1e3a5f" opacity="0.45"/>
    <!-- rib lines -->
    <g stroke="#c7d6ea" stroke-width="1.2" stroke-linecap="round">
      <line x1="59.5" y1="72" x2="59.5" y2="81"/>
      <line x1="63.8" y1="72" x2="63.8" y2="81"/>
      <line x1="68.1" y1="72" x2="68.1" y2="81"/>
      <line x1="72.4" y1="72" x2="72.4" y2="81"/>
      <line x1="76.7" y1="72" x2="76.7" y2="81"/>
      <line x1="81" y1="72" x2="81" y2="81"/>
    </g>
  </g>
</svg>
